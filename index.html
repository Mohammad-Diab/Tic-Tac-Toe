<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>
    Hello HTML CSS JS
</title>
<script>
    function myfunc() {
        var w = window.innerWidth

        var h = window.innerHeight
        var x = document.getElementById("mydiv");
        if (x.style.display === "none")
            x.style.display = "block";
        else
            x.style.display = "none";
        x.style.left = w / 2 + "px";
        x.style.top = h / 2 + "px";
    }
</script>

<style>
    body {
        background: rgba(57, 168, 23, 0.36);
    }
    
    .dodo {
        position: fixed;
        background-color: rgba(168, 221, 175, 0.52);
        z-index: 0;
        transform: translate(-50%, -50%);
    }
</style>
</head>

<body>
    <h2><a href="javascript:void(0);" onclick="myfunc();">Click Me</a></h2>
    <input type="button" onclick="location.href='tick.html'" value="Tic Tac Toe" />
    <div class="dodo" id="mydiv" tabindex="1" style="display: none">
        <h1>
            <font color="#561563">
                Hello JS
            </font>
        </h1>
    </div>
    <div id="original">
        <h1>
            <font color="#428801">
                Hello JS
            </font>
        </h1>
    </div>
</body>

</html>
